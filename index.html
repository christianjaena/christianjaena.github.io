<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Christian Jaena | Software Engineer</title>

    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <!-- Google font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #ffffff;
        --text: #0f172a;
        --muted: #6b7280;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Layout */
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 28px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 980px;
        margin: 0 auto;
        width: 100%;
      }

      /* Simple brand */
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .initials {
        width: 56px;
        height: 56px;
        display: inline-grid;
        place-items: center;
        border-radius: 10px;
        background: #111827;
        color: white;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: 0.6px;
      }
      .nav {
        display: flex;
        gap: 18px;
        align-items: center;
        font-weight: 500;
      }
      .nav a {
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
      }
      .nav a:hover {
        color: var(--text);
        text-decoration: underline;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
      }

      .hero {
        max-width: 920px;
        width: 100%;
        text-align: center;
      }
      .name {
        font-size: 54px;
        line-height: 1;
        font-weight: 800;
        margin: 0;
        letter-spacing: -1px;
      }
      .subtitle {
        margin-top: 14px;
        color: var(--muted);
        font-weight: 400;
        font-size: 18px;
      }

      .social {
        margin-top: 22px;
        display: flex;
        justify-content: center;
        gap: 12px;
      }
      .social a {
        text-decoration: none;
        font-size: 14px;
        color: var(--muted);
        border: 1px solid #e6e6e6;
        padding: 8px 12px;
        border-radius: 8px;
        display: inline-block;
      }
      .social a:hover {
        border-color: #d1d5db;
        color: var(--text);
      }

      .profile-image {
        width: 250px;
        height: 250px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        margin: 0 auto 16px auto;
      }

      footer {
        padding: 20px 24px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        border-top: 1px solid #f3f4f6;
      }

      /* Responsive */
      @media (max-width: 520px) {
        .name {
          font-size: 36px;
        }
        .initials {
          width: 48px;
          height: 48px;
          font-size: 18px;
        }
        header {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <main>
        <section class="hero" role="main">
          <img
            src="assets/profile.jpg"
            alt="Profile Placeholder"
            class="profile-image"
            style="background: #e5e7eb"
            onerror="this.style.display='none'"
          />
          <h1 class="name">Christian Jaena</h1>
          <p class="subtitle">
            A coder fueled by coffee and milk tea
          </p>

          <div class="social" aria-label="Social links">
            <a
              href="https://www.linkedin.com/in/christian-jaena-45490218b"
              target="_blank"
              rel="noopener noreferrer"
              title="LinkedIn"
              aria-label="LinkedIn"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="currentColor"
                style="vertical-align: middle; margin-right: 6px"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-10h3v10zm-1.5-11.268c-.966 0-1.75-.784-1.75-1.75s.784-1.75 1.75-1.75 1.75.784 1.75 1.75-.784 1.75-1.75 1.75zm13.5 11.268h-3v-5.604c0-1.337-.026-3.063-1.868-3.063-1.868 0-2.154 1.459-2.154 2.967v5.7h-3v-10h2.881v1.367h.041c.401-.761 1.381-1.563 2.844-1.563 3.042 0 3.604 2.003 3.604 4.605v5.591z"
                />
              </svg>
              LinkedIn
            </a>
            <a
              href="https://github.com/christianjaena"
              target="_blank"
              rel="noopener noreferrer"
              title="GitHub"
              aria-label="GitHub"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="currentColor"
                style="vertical-align: middle; margin-right: 6px"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.084-.729.084-.729 1.205.084 1.84 1.236 1.84 1.236 1.07 1.834 2.809 1.304 3.495.997.108-.775.418-1.305.762-1.605-2.665-.305-5.466-1.334-5.466-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.523.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.553 3.297-1.23 3.297-1.23.653 1.653.242 2.873.118 3.176.77.84 1.235 1.91 1.235 3.221 0 4.609-2.803 5.624-5.475 5.921.43.372.823 1.102.823 2.222v3.293c0 .322.218.694.825.576 4.765-1.588 8.2-6.084 8.2-11.386 0-6.627-5.373-12-12-12z"
                />
              </svg>
              GitHub
            </a>
            <a
              href="mailto:jaenachristian@gmail.com"
              title="Email"
              aria-label="Email"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="currentColor"
                style="vertical-align: middle; margin-right: 6px"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M12 13.065l-11.99-8.065h23.98l-11.99 8.065zm-12-7.065v14h24v-14l-12 8.065-12-8.065z"
                />
              </svg>
              Email
            </a>
          </div>
        </section>
      </main>

      <footer>Christian Jaena © <span id="yr"></span></footer>
    </div>

    <script>
      // Fill copyright year
      document.getElementById("yr").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
